# goldpan: pulse operations, cuts and derived quantities for SuperCDMS-type traces. It was `python/` of NSDF-Data until 2026-11-05
# (the history of that folder is kept here). The library has its own version, below; `CHANGELOG.md` says what changed in each
# release and `CONTRIBUTING.md` how a release is made.
#
# The name `goldpan` is for the analysis half of a pair: its companion `goldsluice` reduces whole datasets and produces the
# reduced quantities; this one reads pulses and quantities together and analyses them. It is not tied to one experiment.
# `check_environment` is included because the first-analysis guide of NSDF-Data imports it.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goldpan"
version = "0.3.2"
description = "Pulse operations, cuts and derived quantities for SuperCDMS-type traces (NSDF-Data)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy", "awkward"]

[project.urls]
Homepage = "https://github.com/villano-lab/goldpan"
Documentation = "https://villano-lab.github.io/goldpan/"
Repository = "https://github.com/villano-lab/goldpan"
Changelog = "https://github.com/villano-lab/goldpan/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# goldpan.archive writes and reads HDF5 files.
archive = ["h5py"]
# goldpan.adapters.parquet reads and writes the native format.
parquet = ["pyarrow"]
# goldpan.adapters.rq_root reads the RQs in ROOT files.
root = ["uproot"]
# goldpan.adapters.midas reads .mid.lz4 files.
midas = ["lz4"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["goldpan", "goldpan.adapters"]
# The flat names of the first versions, as aliases of the package modules (to be removed in a later release), and the
# environment check, which the first-analysis guide imports.
py-modules = [
    "check_environment",
    "pulse_archive",
    "pulse_channels",
    "pulse_config",
    "pulse_cuts",
    "pulse_io",
    "pulse_operations",
    "pulse_quantities",
    "pulse_status",
]
