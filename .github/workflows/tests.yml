name: tests

# Runs the tests of goldpan on Linux, Windows and macOS with every extra installed, so no test is skipped for a missing package.
# A weekly run tells when a new release of a dependency (numpy, awkward, pyarrow, uproot, ...) breaks goldpan.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # keep in step with requires-python in pyproject.toml

      - name: Install goldpan in place, with its extras
        run: |
          python -m pip install pytest
          python -m pip install -e ".[archive,parquet,root,midas]"
          python -m pip list

      - name: Tests
        run: python -m pytest -q -rs
